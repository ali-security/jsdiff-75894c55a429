before_install:
  - command -v yarn >/dev/null 2>&1 || npm install -g yarn@1.22.22

# yarn.lock pins grunt 1.6.1, whose engines field says node >=16; it runs fine on
# Node 10, so skip the engines check rather than touch the lockfile.
install: yarn install --frozen-lockfile --ignore-engines

# grunt-cli is a devDependency; the image has no global grunt.
script: yarn grunt travis

matrix:
  include:
    - node_js: '21'
      dist: jammy
      env: KARMA=
    - node_js: '10'
      env: KARMA=

cache:
  directories:
    - node_modules
